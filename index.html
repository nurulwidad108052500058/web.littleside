<script>

 {id:'monstera',name:'Monstera Deliciosa',price:75000,light:'Cahaya sedang',care:'Mudah',pet:'Tidak aman',size:'Besar',rating:'4.9',reviews:128,category:'Indoor',img:'photo-1501004318641-b39e6451bec6',desc:'Tanaman tropis dengan daun lebar berlubang yang ikonik. Monstera memberi sentuhan rimbun dan segar pada sudut ruangan favoritmu.'},
 {id:'pothos',name:'Pothos',price:45000,light:'Cahaya rendah',care:'Mudah',pet:'Tidak aman',size:'Sedang',rating:'4.9',reviews:94,category:'Indoor',img:'photo-1497250681960-ef046c08a56e',desc:'Si cantik yang tumbuh menjuntai dan sangat mudah dirawat. Pilihan sempurna untuk rak buku atau sudut yang teduh.'},
 {id:'zz',name:'ZZ Plant',price:89000,light:'Cahaya rendah',care:'Mudah',pet:'Tidak aman',size:'Sedang',rating:'4.8',reviews:76,category:'Low Maintenance',img:'photo-1485955900006-10f4d324d411',desc:'Tangguh, mengilap, dan tidak rewel. ZZ Plant tetap tampil menawan meski terlambat disiram.'},

 {id:'peperomia',name:'Peperomia',price:62000,light:'Cahaya terang',care:'Mudah',pet:'Aman',size:'Kecil',rating:'4.8',reviews:48,category:'Pemula',img:'photo-1509423350716-97f9360b4e09',desc:'Kecil, kompak, dan punya banyak variasi daun menarik. Mudah dirawat di meja kerja atau ambang jendela.'},

];
const cats=[['Indoor','🌿','Bawa suasana segar ke dalam rumah.'],['Outdoor','☀️','Teman hijau untuk teras dan taman.'],['Pemula','🌱','Pilihan mudah untuk mulai merawat.'],['Low Maintenance','🪴','Tetap cantik tanpa banyak repot.'],['Pet Friendly','🐾','Pilihan aman untuk sahabat berbulu.']];
let cart=JSON.parse(localStorage.getItem('ls-cart')||'{}'), filters={},sort='recommended', detailQty=1,activeTab='Deskripsi',checkoutOrder=null;
const img=(p)=>`https://images.unsplash.com/${p.img}?auto=format&fit=crop&w=700&q=82`;
const money=n=>'Rp'+Number(n).toLocaleString('id-ID');
function save(){localStorage.setItem('ls-cart',JSON.stringify(cart));document.getElementById('cartCount').textContent=Object.values(cart).reduce((a,b)=>a+b,0)}
function toast(msg){let t=document.getElementById('toast');t.textContent=msg;t.classList.remove('hidden');setTimeout(()=>t.classList.add('hidden'),2100)}
function add(id,n=1){cart[id]=(cart[id]||0)+n;save();toast('Tanaman berhasil ditambahkan ke keranjang 🌱')}
function setQty(id,n){if(n<=0)delete cart[id];else cart[id]=n;save();render()}
function card(p){return `<article class="product"><div class="product-photo" data-detail="${p.id}"><img src="${img(p)}" alt="${p.name}" loading="lazy"><button class="heart" aria-label="Simpan favorit" onclick="event.stopPropagation();this.textContent=this.textContent==='♡'?'♥':'♡'">♡</button></div><div class="product-body"><div class="product-title" data-detail="${p.id}">${p.name}</div><div class="rating"><b>★ ${p.rating}</b> · ${p.reviews} ulasan</div><div class="price">${money(p.price)}</div><div class="meta"><span>☼ ${p.light}</span>　<span>♡ ${p.care}</span></div><div class="product-foot"><span class="pill">${p.category}</span><button class="add-mini" aria-label="Tambah ${p.name}" onclick="add('${p.id}')">+</button></div></div></article>`}
function grid(list,cls=''){return `<div class="product-grid ${cls}">${list.map(card).join('')}</div>`}
function head(title,sub){return `<section class="page-head wrap"><div class="eyebrow">Temukan teman hijau barumu</div><h1>${title}</h1><p>${sub}</p></section>`}
function home(){let featured=products.slice(0,4);return `<section class="hero wrap"><div class="hero-box"><div class="hero-copy"><span class="pill">✦ Bikin rumah makin hidup</span><h1>Temukan Tanaman yang Tepat untuk Kamu</h1><p>Mulai perjalanan hijaumu dengan tanaman yang cocok untuk ruang, rutinitas, dan gaya hidupmu.</p><a class="btn" href="#categories">Jelajahi Tanaman <span>→</span></a></div><div class="hero-art"><img src="https://images.unsplash.com/photo-1497250681960-ef046c08a56e?auto=format&fit=crop&w=1100&q=85" alt="Tanaman hijau di rumah"></div></div></section><section class="section wrap"><div class="section-head"><div><div class="eyebrow">Cari berdasarkan kebutuhan</div><h2>Temukan tanamanmu</h2></div><a href="#categories">Semua kategori →</a></div><div class="category-row">${cats.map(c=>`<a class="category" href="#search?category=${encodeURIComponent(c[0])}"><div class="cat-icon">${c[1]}</div><strong>${c[0]}</strong><span>${c[2]}</span></a>`).join('')}</div></section><section class="section wrap"><div class="section-head"><div><div class="eyebrow">Pilihan khusus untukmu</div><h2>Rekomendasi untuk Kamu</h2></div><a href="#recommendations">Lihat semua →</a></div>${grid(featured)}</section><section class="wrap"><div class="why"><div><h3>Tanaman pertama? Tenang, kami bantu 🌿</h3><p>Panduan sederhana dan tanaman yang mudah dirawat untuk memulai.</p></div><a class="btn secondary" href="#recommendations">Cari rekomendasiku →</a></div></section>`}
function categories(){return `${head('Kategori Tanaman','Temukan tanaman yang paling pas untuk ruang dan keseharianmu.')}<section class="section wrap" style="padding-top:4px"><div class="category-grid">${cats.map(c=>`<a class="category large" href="#search?category=${encodeURIComponent(c[0])}"><div class="cat-icon">${c[1]}</div><strong>${c[0]}</strong><p>${c[2]}</p><span style="color:var(--green2);font-weight:700">Lihat tanaman →</span></a>`).join('')}</div></section>`}
const groups=[['light','Kebutuhan cahaya',['Cahaya rendah','Cahaya sedang','Cahaya terang']],['size','Ukuran tanaman',['Kecil','Sedang','Besar']],['price','Harga',['Di bawah Rp50.000','Rp50.000–Rp100.000','Di atas Rp100.000']],['care','Tingkat perawatan',['Mudah','Sedang','Sulit']],['pet','Aman untuk hewan peliharaan',['Ya','Tidak']]];
function filterPage(){return `${head('Filter & Urutkan','Sesuaikan pilihan tanaman dengan kebutuhanmu.')}<div class="wrap filter-layout"><aside class="filter-panel"><h3>Sesuaikan pilihan</h3>${groups.map(([key,title,opts])=>`<div class="filter-group"><h4>${title}</h4>${opts.map(o=>`<label class="check"><input type="checkbox" data-filter="${key}" value="${o}" ${filters[key]===o?'checked':''}> ${o}</label>`).join('')}</div>`).join('')}<div class="filter-actions"><button class="btn" id="applyFilters">Terapkan Filter</button><button class="btn outline" id="resetFilters">Reset</button></div></aside><div><div class="catalog-top"><small>${products.length} tanaman tersedia</small><select id="sortSelect"><option value="recommended">Rekomendasi</option><option value="low">Harga terendah</option><option value="high">Harga tertinggi</option></select></div><div id="filterPreview">${grid(filteredProducts(),'result-grid')}</div></div></div>`}
function matches(p,fs=filters){return Object.entries(fs).every(([k,v])=>{if(!v)return true;if(k==='price')return v.startsWith('Di bawah')?p.price<50000:v.startsWith('Rp50')?p.price>=50000&&p.price<=100000:p.price>100000;if(k==='pet')return v==='Ya'?p.pet==='Aman':'Tidak aman';return p[k]===v})}
function filteredProducts(){let list=products.filter(p=>matches(p));if(sort==='low')list.sort((a,b)=>a.price-b.price);if(sort==='high')list.sort((a,b)=>b.price-a.price);return list}
function searchPage(){const q=new URLSearchParams(location.hash.split('?')[1]||'');let term=(q.get('q')||'').toLowerCase(),cat=q.get('category');let list=products.filter(p=>(!term||p.name.toLowerCase().includes(term)||p.category.toLowerCase().includes(term))&&(!cat||p.category.toLowerCase()===cat.toLowerCase()));if(Object.keys(filters).length)list=list.filter(p=>matches(p));if(sort==='low')list.sort((a,b)=>a.price-b.price);if(sort==='high')list.sort((a,b)=>b.price-a.price);let tags=[...(term?[`Pencarian: ${term}`]:[]),...(cat?[cat]:[]),...Object.values(filters)];return `${head('Tanaman yang Cocok Untukmu',term?`Hasil pencarian untuk “${term}”`:'Pilihan tanaman yang sesuai dengan kebutuhanmu.')}<section class="wrap" style="padding-bottom:55px"><div class="catalog-top"><small>${list.length} tanaman ditemukan</small><div style="display:flex;gap:8px;align-items:center"><a class="btn outline" href="#filters" style="padding:9px 12px">☷ Filter</a><select id="sortSelect"><option value="recommended">Rekomendasi</option><option value="low">Harga terendah</option><option value="high">Harga tertinggi</option></select></div></div>${tags.length?`<div class="tag-row">${tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div>`:''}${list.length?grid(list,'result-grid'):`<div class="empty"><div class="empty-icon">🔎</div><h2>Tanaman belum ditemukan</h2><p>Coba kata pencarian lain, siapa tahu ada yang cocok.</p><a class="btn" href="#categories">Jelajahi kategori</a></div>`}</section>`}
function detail(){let p=products.find(x=>x.id==='monstera');return `<section class="wrap detail-layout"><div><div class="detail-image"><img src="${img(p)}" alt="Monstera Deliciosa"></div></div><div class="detail-info"><div class="crumb"><a href="#home">Beranda</a>　›　<a href="#search?category=Indoor">Indoor</a>　›　Monstera Deliciosa</div><span class="pill">Indoor favorite</span><h1>Monstera Deliciosa</h1><div class="rating"><b>★ 4.9</b> · ${p.reviews} ulasan pelanggan</div><div class="detail-price">${money(p.price)}</div><p class="detail-desc">${p.desc}</p><div class="facts"><div class="fact"><small>☼ Kebutuhan cahaya</small><b>${p.light}</b></div><div class="fact"><small>💧 Penyiraman</small><b>1–2 kali seminggu</b></div><div class="fact"><small>♡ Tingkat perawatan</small><b>${p.care}</b></div><div class="fact"><small>🐾 Aman untuk hewan</small><b>${p.pet}</b></div><div class="fact"><small>↕ Ukuran tanaman</small><b>${p.size} · tinggi ±35 cm</b></div><div class="fact"><small>📦 Sudah termasuk</small><b>Pot & media tanam</b></div></div><div class="detail-actions"><div class="qty"><button data-dqty="-">−</button><span id="detailQty">${detailQty}</span><button data-dqty="+">+</button></div><button class="btn" id="addDetail">Tambah ke Keranjang　＋</button></div><div class="tabs">${['Deskripsi','Cara Perawatan','Informasi Tambahan'].map(t=>`<button class="tab ${activeTab===t?'active':''}" data-tab="${t}">${t}</button>`).join('')}</div><div class="tab-copy">${activeTab==='Deskripsi'?p.desc:activeTab==='Cara Perawatan'?'Letakkan di area bercahaya sedang dan hindari sinar matahari langsung. Siram saat 2–3 cm permukaan tanah terasa kering. Lap daun berkala agar tetap bersih dan segar.':'Tinggi tanaman sekitar 35 cm. Termasuk pot dekoratif berdiameter 14 cm dan media tanam pilihan. Tanaman ini tidak aman jika tertelan hewan peliharaan.'}</div></div></section>`}
function recommendations(){let ids=['pothos','zz','spider','peace'];return `${head('Rekomendasi untuk Kamu','Kami memilihkan tanaman yang cocok dengan preferensimu.')}<section class="wrap" style="padding-bottom:55px"><div class="prefs"><span class="tag">⌂ Indoor</span><span class="tag">☾ Cahaya Rendah</span><span class="tag">✦ Mudah Dirawat</span><span class="tag">🐾 Pet Friendly</span></div><div class="section-head"><div><div class="eyebrow">Dipilih untukmu</div><h2>Mulai dari yang mudah</h2></div><a href="#filters">Ubah preferensi →</a></div>${grid(ids.map(id=>products.find(p=>p.id===id)))}<div style="text-align:center;margin-top:26px"><a class="btn secondary" href="#search">Jelajahi semua tanaman</a></div></section>`}
function cartPage(){let entries=Object.entries(cart).filter(([id,n])=>n>0),subtotal=entries.reduce((s,[id,n])=>s+(products.find(p=>p.id===id)?.price||0)*n,0),ship=subtotal>=150000||subtotal===0?0:12000;return `${head('Keranjang Belanja',entries.length?`${entries.length} jenis tanaman siap tumbuh di rumahmu.`:'Keranjangmu sedang menunggu tanaman pertama.')}<section class="wrap cart-layout">${entries.length?`<div class="cart-list">${entries.map(([id,n])=>{let p=products.find(x=>x.id===id);return `<div class="cart-item"><img src="${img(p)}" alt="${p.name}"><div><h3>${p.name}</h3><small>${p.light} · Perawatan ${p.care.toLowerCase()}</small><div><div class="qty"><button data-qty="${id}" data-delta="-1">−</button><span>${n}</span><button data-qty="${id}" data-delta="1">+</button></div><button class="remove" data-remove="${id}">Hapus</button></div></div><b class="price">${money(p.price*n)}</b></div>`}).join('')}</div><aside class="summary"><h2>Ringkasan Pesanan</h2><div class="sum-line"><span>Subtotal</span><span>${money(subtotal)}</span></div><div class="sum-line"><span>Ongkir</span><span>${ship===0?'Gratis':money(ship)}</span></div>${subtotal>0&&subtotal<150000?`<div class="notice">Belanja ${money(150000-subtotal)} lagi untuk gratis ongkir!</div>`:''}<div class="sum-line total"><span>Total</span><span>${money(subtotal+ship)}</span></div><button class="btn" id="checkout">Lanjut ke Pembayaran　→</button><a class="btn secondary" href="#home" style="margin-top:9px">Lanjut Belanja</a><div class="notice">🔒 Pembayaran aman · Tanaman dikemas dengan hati-hati</div></aside>`:`<div class="empty" style="grid-column:1/-1"><div class="empty-icon">🪴</div><h2>Keranjangmu masih kosong</h2><p>Yuk, temukan tanaman yang cocok untuk rumahmu.</p><a class="btn" href="#home">Mulai Belanja</a></div>`}</section>`}
function checkoutPage(){let entries=Object.entries(cart).filter(([id,n])=>n>0),subtotal=entries.reduce((s,[id,n])=>s+(products.find(p=>p.id===id)?.price||0)*n,0),ship=subtotal>=150000||subtotal===0?0:12000,total=subtotal+ship;if(checkoutOrder)return `<section class="wrap checkout-success"><div class="success-icon">✓</div><h1>Pesanan Berhasil Dibuat!</h1><p>Terima kasih telah berbelanja di LittleSeed Plants.</p><div class="order-number">Nomor Pesanan: ${checkoutOrder}</div><br><a class="btn" href="#home">Kembali ke Beranda</a></section>`;if(!entries.length)return `${head('Pembayaran','Keranjang belanjamu masih kosong.')}<section class="wrap" style="padding-bottom:55px"><div class="empty"><div class="empty-icon">🪴</div><h2>Belum ada pesanan untuk dibayar</h2><p>Tambahkan tanaman ke keranjang untuk melanjutkan.</p><a class="btn" href="#home">Mulai Belanja</a></div></section>`;return `${head('Pembayaran','Lengkapi informasi pengiriman dan pilih metode pembayaran.')}<form id="checkoutForm" class="wrap checkout-layout"><div class="checkout-card"><section class="checkout-section"><h2>Informasi Pengiriman</h2><div class="checkout-form"><div class="field full"><label for="fullName">Nama Lengkap</label><input id="fullName" name="fullName" autocomplete="name" placeholder="Nama penerima" required></div><div class="field full"><label for="phone">Nomor Telepon</label><input id="phone" name="phone" type="tel" autocomplete="tel" placeholder="08xxxxxxxxxx" required></div><div class="field full"><label for="address">Alamat Lengkap</label><textarea id="address" name="address" autocomplete="street-address" placeholder="Nama jalan, nomor rumah, RT/RW, kecamatan" required></textarea></div><div class="field"><label for="city">Kota</label><input id="city" name="city" autocomplete="address-level2" placeholder="Kota tujuan" required></div><div class="field"><label for="postal">Kode Pos</label><input id="postal" name="postal" inputmode="numeric" autocomplete="postal-code" placeholder="Kode pos" required></div></div></section><section class="checkout-section"><h2>Metode Pembayaran</h2><div class="payment-options"><label class="payment-option"><input type="radio" name="payment" value="Transfer Bank" required> 🏦　Transfer Bank</label><label class="payment-option"><input type="radio" name="payment" value="E-Wallet"> 📱　E-Wallet</label><label class="payment-option"><input type="radio" name="payment" value="COD"> 💵　COD (Bayar di tempat)</label></div></section></div><aside class="checkout-card"><h2>Ringkasan Pesanan</h2><div class="checkout-products">${entries.map(([id,n])=>{let p=products.find(x=>x.id===id);return `<div class="checkout-product"><img src="${img(p)}" alt="${p.name}"><div><b>${p.name}</b><small>Jumlah: ${n}</small></div><b>${money(p.price*n)}</b></div>`}).join('')}</div><div class="sum-line" style="border-top:1px solid var(--line);padding-top:15px;margin-top:17px"><span>Subtotal</span><span>${money(subtotal)}</span></div><div class="sum-line"><span>Ongkir</span><span>${ship===0?'Gratis':money(ship)}</span></div><div class="sum-line total"><span>Total Pembayaran</span><span>${money(total)}</span></div><button class="btn" type="submit" style="width:100%;justify-content:center;margin-top:12px">Bayar Sekarang　→</button><div class="notice">🔒 Informasi pengirimanmu digunakan untuk memproses pesanan.</div></aside></form>`}
function render(){let route=(location.hash.slice(1).split('?')[0]||'home'),app=document.getElementById('app');document.querySelectorAll('.links a').forEach(a=>a.classList.toggle('active',a.hash===`#${route}`));app.innerHTML=route==='home'?home():route==='categories'?categories():route==='filters'?filterPage():route==='search'?searchPage():route==='detail'?detail():route==='recommendations'?recommendations():route==='cart'?cartPage():route==='checkout'?checkoutPage():home();save()}
document.addEventListener('submit',e=>{if(e.target.id==='checkoutForm'){e.preventDefault();if(!e.target.reportValidity())return;checkoutOrder='LS-'+Math.random().toString(36).slice(2,8).toUpperCase();render();window.scrollTo({top:0,behavior:'smooth'})}});
document.addEventListener('click',e=>{let d=e.target.closest('[data-detail]');if(d){location.hash='#detail';return}let tab=e.target.closest('[data-tab]');if(tab){activeTab=tab.dataset.tab;render();return}let dq=e.target.closest('[data-dqty]');if(dq){detailQty=Math.max(1,detailQty+(dq.dataset.dqty==='+'?1:-1));render();return}let qty=e.target.closest('[data-qty]');if(qty){setQty(qty.dataset.qty,(cart[qty.dataset.qty]||0)+Number(qty.dataset.delta));return}let rm=e.target.closest('[data-remove]');if(rm){delete cart[rm.dataset.remove];save();render();toast('Tanaman dihapus dari keranjang');return}if(e.target.id==='addDetail'){add('monstera',detailQty);return}if(e.target.id==='applyFilters'){filters={};document.querySelectorAll('[data-filter]:checked').forEach(x=>filters[x.dataset.filter]=x.value);location.hash='#search';return}if(e.target.id==='resetFilters'){filters={};sort='recommended';render();return}if(e.target.id==='checkout'){location.hash='#checkout';return}});
document.addEventListener('change',e=>{if(e.target.id==='sortSelect'){sort=e.target.value;if(location.hash.startsWith('#filters')){document.getElementById('filterPreview').innerHTML=grid(filteredProducts(),'result-grid')}else render()}});
document.getElementById('searchForm').addEventListener('submit',e=>{e.preventDefault();let q=document.getElementById('searchInput').value.trim();location.hash='#search'+(q?'?q='+encodeURIComponent(q):'');});
window.addEventListener('hashchange',render);window.addEventListener('DOMContentLoaded',render);render();
</script></body></html>
